<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astra</title>
<style>
  :root {
    --primary:#3C6939; --on-primary:#FFFFFF; --primary-container:#BCF0B4; --on-primary-container:#245024;
    --secondary:#52634F; --secondary-container:#D6E8CE; --on-secondary-container:#3B4B38;
    --tertiary:#38656A; --tertiary-container:#BCEBF0; --on-tertiary-container:#1F4D52;
    --background:#F7FBF1; --surface:#F7FBF1; --surface-dim:#D8DBD2;
    --surface-container-lowest:#FFFFFF; --surface-container-low:#F1F5EB; --surface-container:#ECEFE6;
    --surface-container-high:#E6E9E0; --surface-container-highest:#E0E4DB;
    --on-surface:#191D17; --on-surface-variant:#424940; --surface-variant:#DEE5D8;
    --outline:#72796F; --outline-variant:#C2C9BD; --error:#BA1A1A;
    --error-container:#FFDAD6; --on-error-container:#93000A;
    --inverse-surface:#2D322C; --inverse-on-surface:#EFF2E9;
  }
  html[data-theme="dark"] {
    --primary:#A1D39A; --on-primary:#0A390F; --primary-container:#245024; --on-primary-container:#BCF0B4;
    --secondary:#BACCB3; --secondary-container:#3B4B38; --on-secondary-container:#D6E8CE;
    --tertiary:#A0CFD4; --tertiary-container:#1F4D52; --on-tertiary-container:#BCEBF0;
    --background:#10140F; --surface:#10140F; --surface-dim:#10140F;
    --surface-container-lowest:#0B0F0A; --surface-container-low:#191D17; --surface-container:#1D211B;
    --surface-container-high:#272B25; --surface-container-highest:#323630;
    --on-surface:#E0E4DB; --on-surface-variant:#C2C9BD; --surface-variant:#424940;
    --outline:#8C9388; --outline-variant:#424940; --error:#FFB4AB;
    --error-container:#93000A; --on-error-container:#FFDAD6;
    --inverse-surface:#E0E4DB; --inverse-on-surface:#2D322C;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:"Roboto","Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--background); color:var(--on-surface);
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .appbar {
    position:sticky; top:0; z-index:10; backdrop-filter:blur(16px);
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    border-bottom:1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent);
  }
  .appbar-inner {
    max-width:800px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:14px;
  }
  .logo {
    width:44px; height:44px; border-radius:14px; flex:none;
    background:linear-gradient(135deg, var(--primary), var(--tertiary));
    color:var(--on-primary); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px; letter-spacing:.5px;
  }
  .title-wrap { flex:1; min-width:0; }
  .title { font-size:20px; font-weight:800; letter-spacing:.2px; }
  .subtitle { font-size:13px; color:var(--on-surface-variant); margin-top:1px; }
  .iconbtn {
    border:none; cursor:pointer; background:none; color:var(--on-surface);
    width:40px; height:40px; border-radius:20px; display:flex; align-items:center; justify-content:center;
    transition:background .2s, transform .1s;
  }
  .iconbtn:hover { background:color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .iconbtn:active { transform:scale(.92); }
  .iconbtn svg { width:22px; height:22px; }
  .spinner { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .wrap { max-width:800px; margin:0 auto; padding:20px 16px 96px; }
  .search {
    display:flex; align-items:center; gap:10px; background:var(--surface-container-low);
    border:1px solid color-mix(in srgb, var(--outline) 30%, transparent);
    border-radius:28px; padding:4px 16px; margin-bottom:20px;
  }
  .search svg { width:20px; height:20px; color:var(--on-surface-variant); flex:none; }
  .search input {
    flex:1; border:none; outline:none; background:none; color:var(--on-surface);
    font-size:15px; padding:10px 0; font-family:inherit;
  }
  .search input::placeholder { color:var(--on-surface-variant); }
  .meta {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:16px; color:var(--on-surface-variant); font-size:13px;
  }
  .status { display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--primary); }
  .dot.err { background:var(--error); }
  .day-card {
    background:var(--surface-container-low); border-radius:28px; padding:20px; margin-bottom:16px;
    border:1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
    transition:box-shadow .2s;
  }
  .day-card.today { background:var(--primary-container); }
  .day-card.today .day-title { color:var(--on-primary-container); }
  .day-card.today .count { color:var(--on-primary-container); opacity:.75; }
  .day-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .day-title { font-size:24px; font-weight:800; color:var(--primary); letter-spacing:.2px; }
  .count { font-size:14px; color:var(--on-surface-variant); margin-top:2px; }
  .badge {
    margin-left:auto; font-size:11px; font-weight:700; padding:4px 12px; border-radius:20px;
    background:var(--secondary-container); color:var(--on-secondary-container);
  }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip {
    font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px;
    background:var(--secondary-container); color:var(--on-secondary-container);
  }
  .chip.more { opacity:.75; }
  .rows { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .row {
    background:var(--surface-container); border-radius:18px; padding:14px;
    display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  }
  .period {
    font-weight:800; font-size:14px; min-width:34px; text-align:center;
    background:var(--surface-container-highest); color:var(--on-surface);
    border-radius:12px; padding:8px 6px;
  }
  .subject { font-weight:700; font-size:15px; color:var(--primary); }
  .type-badge {
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px; white-space:nowrap;
  }
  .room { font-size:13px; color:var(--on-surface); margin-top:2px; font-weight:600; }
  .note {
    grid-column:1 / -1; margin-top:2px; display:flex; gap:8px; align-items:flex-start;
    background:color-mix(in srgb, var(--primary-container) 45%, transparent);
    border-radius:14px; padding:10px 12px; color:var(--on-surface-variant); font-size:13px; line-height:1.45;
  }
  .note svg { width:15px; height:15px; color:var(--primary); flex:none; margin-top:1px; }
  .empty {
    text-align:center; padding:80px 24px; color:var(--outline);
  }
  .empty .big { font-size:56px; margin-bottom:16px; opacity:.8; }
  .empty h2 { font-size:18px; color:var(--on-surface); margin-bottom:6px; }
  .footer { text-align:center; color:var(--outline); font-size:12px; margin-top:8px; }
  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(80px);
    background:var(--inverse-surface); color:var(--inverse-on-surface);
    padding:10px 20px; border-radius:20px; font-size:14px; transition:transform .25s; z-index:20;
    box-shadow:0 6px 24px rgba(0,0,0,.18);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  @media (min-width:640px) {
    .row { grid-template-columns:auto 1fr auto; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="logo">A</div>
      <div class="title-wrap">
        <div class="title">Astra</div>
        <div class="subtitle" id="subtitle">Substitution plan</div>
      </div>
      <button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <div class="wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search subject, room, class…" autocomplete="off">
    </div>
    <div class="meta">
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Loading…</span></span>
      <span id="updatedText"></span>
    </div>
    <main id="content"></main>
    <div class="footer">Served locally by Astra</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const refreshBtn = document.getElementById('refreshBtn');
  const searchInput = document.getElementById('search');
  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('statusText');
  const updatedEl = document.getElementById('updatedText');
  const dotEl = document.getElementById('dot');
  const toastEl = document.getElementById('toast');

  let state = { entries: [], theme: {}, isRoomFirst: true, sortByPeriod: true, updatedAt: 0 };
  let timer = null;

  const TYPE_COLORS = [
    [/(entfall)/, '#D32F2F'],
    [/(eigenvertretung)/, '#7B1FA2'],
    [/(vertretung)/, '#F57C00'],
    [/(verlegung|verschiebung)/, '#1976D2'],
    [/(betreuung)/, '#388E3C'],
    [/(raum)/, '#00838F'],
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
    ));
  }

  function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement;
    root.setAttribute('data-theme', theme.dark ? 'dark' : 'light');
    for (const [k, v] of Object.entries(theme)) {
      if (k === 'dark') continue;
      root.style.setProperty('--' + k, v);
    }
  }

  function typeStyle(art) {
    const l = String(art || '').toLowerCase();
    for (const [re, color] of TYPE_COLORS) {
      if (re.test(l)) return color;
    }
    return null;
  }

  function dayFilter(day) {
    const l = String(day || '').toLowerCase();
    return !l.includes('samstag') && !l.includes('sonntag') &&
           !l.includes('saturday') && !l.includes('sunday');
  }

  function daySortKey(day) {
    const m = /(\d{2})\.(\d{2})\.(\d{4})/.exec(day || '');
    if (m) return +m[3] * 10000 + +m[2] * 100 + +m[1];
    const names = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
    const idx = names.findIndex(n => day.toLowerCase().startsWith(n.toLowerCase()));
    return idx >= 0 ? idx + 1 : Number.MAX_SAFE_INTEGER;
  }

  function periodSortKey(lesson) {
    const n = /(\d+)/.exec(lesson || '');
    return n ? +n[1] : 999;
  }

  function render() {
    let entries = state.entries.filter(e => dayFilter(e.day));
    const q = searchInput.value.trim().toLowerCase();
    if (q) {
      entries = entries.filter(e =>
        String(e.subject || '').toLowerCase().includes(q) ||
        String(e.room || '').toLowerCase().includes(q) ||
        String(e.art || '').toLowerCase().includes(q) ||
        String(e.text || '').toLowerCase().includes(q) ||
        String(e.lesson || '').toLowerCase().includes(q) ||
        String(e.className || '').toLowerCase().includes(q));
    }

    if (entries.length === 0) {
      contentEl.innerHTML =
        '<div class="empty"><div class="big">&#128196;</div>' +
        '<h2>' + (q ? 'No results' : 'No substitutions yet') + '</h2>' +
        '<p>' + (q ? 'Try a different search.' : 'Pull to refresh in the app or wait for the next update.') + '</p></div>';
      return;
    }

    const days = [...new Set(entries.map(e => e.day))].sort((a, b) => daySortKey(a) - daySortKey(b));
    const todayNames = new Date().toLocaleDateString('de-DE', { weekday:'long' });

    let html = '';
    for (const day of days) {
      let dayEntries = entries.filter(e => e.day === day);
      if (state.sortByPeriod) {
        dayEntries = [...dayEntries].sort((a, b) => periodSortKey(a.lesson) - periodSortKey(b.lesson));
      }
      const classes = [...new Set(dayEntries.map(e => e.className).filter(c => c && c.length > 0))];
      const isToday = day.toLowerCase().startsWith(todayNames.toLowerCase());
      const visible = classes.slice(0, 5);
      const overflow = classes.length - visible.length;

      html += '<section class="day-card' + (isToday ? ' today' : '') + '">';
      html += '<div class="day-head"><div class="day-title">' + esc(day) + '</div>';
      html += '<div class="count">' + dayEntries.length + ' ' + (dayEntries.length === 1 ? 'entry' : 'entries') + '</div>';
      if (isToday) html += '<span class="badge">TODAY</span>';
      html += '</div>';
      if (visible.length > 0) {
        html += '<div class="chips">';
        for (const c of visible) html += '<span class="chip">' + esc(c) + '</span>';
        if (overflow > 0) html += '<span class="chip more">+' + overflow + '</span>';
        html += '</div>';
      }
      html += '<div class="rows">';
      for (const e of dayEntries) {
        const isRoomFirst = state.isRoomFirst;
        const roomDisplay = isRoomFirst ? e.room : e.art;
        const typeDisplay = isRoomFirst ? e.art : e.room;
        const tColor = typeStyle(typeDisplay);
        const fg = tColor || getComputedStyle(document.documentElement).getPropertyValue('--secondary').trim();
        const bg = tColor ? tColor + '1f' : 'var(--secondary-container)';
        const fgFinal = tColor || 'var(--on-secondary-container)';
        html += '<div class="row">';
        html += '<div class="period">' + esc(e.lesson) + '</div>';
        html += '<div><div class="subject">' + esc(e.subject) + '</div>';
        html += '<div class="room">' + esc(roomDisplay || '—') + '</div></div>';
        html += '<span class="type-badge" style="background:' + bg + ';color:' + fgFinal + ';">' + esc(typeDisplay) + '</span>';
        if (e.text && e.text.length > 0) {
          html += '<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg><span>' + esc(e.text) + '</span></div>';
        }
        html += '</div>';
      }
      html += '</div></section>';
    }
    contentEl.innerHTML = html;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  async function loadData(manual) {
    if (manual) refreshBtn.classList.add('spinner');
    dotEl.classList.remove('err');
    statusEl.textContent = 'Loading…';
    try {
      const res = await fetch('/api/data');
      const data = await res.json();
      state = { entries: data.entries || [], theme: data.theme || {}, isRoomFirst: !!data.isRoomFirst, sortByPeriod: !!data.sortByPeriod, updatedAt: data.updatedAt || 0 };
      applyTheme(state.theme);
      render();
      statusEl.textContent = 'Live';
      updatedEl.textContent = state.updatedAt
        ? 'Updated ' + new Date(state.updatedAt).toLocaleString()
        : '';
      scheduleRefresh();
    } catch (e) {
      dotEl.classList.add('err');
      statusEl.textContent = 'Server offline';
      if (manual) showToast('Server not reachable');
    } finally {
      refreshBtn.classList.remove('spinner');
    }
  }

  function scheduleRefresh() {
    clearTimeout(timer);
    timer = setTimeout(() => loadData(false), 60000);
  }

  refreshBtn.addEventListener('click', () => loadData(true));
  searchInput.addEventListener('input', render);

  loadData(false);
  setInterval(() => loadData(false), 60000);
</script>
</body>
</html>
