services:
  astra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-schulplaner-backend:latest
    container_name: astra-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-astra-super-secure-production-jwt-secret-key}
      - JWT_EXPIRES_IN=7d
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-adminpassword}
      - DATA_DIR=/app/data
      - CORS_ORIGIN=*
    volumes:
      - astra_data:/app/data

volumes:
  astra_data:
    driver: local
